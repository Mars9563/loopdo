name: server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "supabase/migrations/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mars9563/loopdo-api

jobs:
  test-build-deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test (shared rules + API against a real Supabase Postgres) and build
        run: ./gradlew :shared:test :server:test :server:installDist --console=plain
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
      - name: Bump the image tag in k8s/api.yaml
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            sed -i -E "s#(image: ghcr\.io/mars9563/loopdo-api:).*#\1${GITHUB_SHA}#" k8s/api.yaml
            git add k8s/api.yaml
            if git diff --cached --quiet; then
              echo "already at ${GITHUB_SHA}"; exit 0
            fi
            git commit --quiet -m "cd: deploy loopdo-api @ ${GITHUB_SHA} [skip ci]"
            if git push origin HEAD:main; then
              echo "deployed loopdo-api @ ${GITHUB_SHA}"; exit 0
            fi
            echo "push race on attempt ${attempt}; retrying"; sleep $(( (RANDOM % 4) + 1 ))
          done
          echo "could not push the bump after 5 attempts"; exit 1
