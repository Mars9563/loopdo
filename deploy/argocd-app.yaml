apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loopdo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mars9563/loopdo.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: loopdo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
